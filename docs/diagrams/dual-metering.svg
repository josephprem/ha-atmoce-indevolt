<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="m-amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m-slate" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#4ade80" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m-violet" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="16" fill="#0b1220"/>
  <text x="40" y="42" fill="#f8fafc" font-family="Arial,sans-serif" font-size="22" font-weight="700">Indevolt dual metering</text>
  <text x="40" y="66" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Third-party PV with separate grid and solar meters</text>

  <g filter="url(#shadow)" transform="translate(40,128)">
    <rect width="156" height="68" rx="14" fill="url(#card)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="78" y="30" text-anchor="middle" fill="#fef3c7" font-family="Arial,sans-serif" font-size="12" font-weight="600">Atmoce PV</text>
    <text x="78" y="50" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">MC100 - 9 kWp</text>
  </g>

  <g filter="url(#shadow)" transform="translate(248,108)">
    <rect width="176" height="88" rx="14" fill="url(#card)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="88" y="32" text-anchor="middle" fill="#dcfce7" font-family="Arial,sans-serif" font-size="12" font-weight="600">PV meter</text>
    <text x="88" y="52" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">Shelly 3EM emulator</text>
    <text x="88" y="70" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Solar data source</text>
  </g>

  <g filter="url(#shadow)" transform="translate(488,128)">
    <rect width="136" height="68" rx="14" fill="url(#card)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="68" y="38" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="12" font-weight="600">Home load</text>
  </g>

  <g filter="url(#shadow)" transform="translate(688,108)">
    <rect width="176" height="88" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="88" y="32" text-anchor="middle" fill="#ede9fe" font-family="Arial,sans-serif" font-size="12" font-weight="600">Grid meter</text>
    <text x="88" y="52" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">Solarman SMD1</text>
    <text x="88" y="70" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Grid data source</text>
  </g>

  <g filter="url(#shadow)" transform="translate(360,268)">
    <rect width="200" height="88" rx="14" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="34" text-anchor="middle" fill="#e0f2fe" font-family="Arial,sans-serif" font-size="13" font-weight="600">SF3000AC + SFA3600</text>
    <text x="100" y="56" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">Charge / discharge control</text>
    <text x="100" y="74" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Zero-export mode</text>
  </g>

  <g filter="url(#shadow)" transform="translate(40,288)">
    <rect width="136" height="56" rx="14" fill="url(#card)" stroke="#64748b" stroke-width="1.5"/>
    <text x="68" y="34" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="12" font-weight="600">Utility grid</text>
  </g>

  <path d="M 196 162 C 218 158, 232 152, 248 148" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-amber)" opacity="0.9"/>
  <path d="M 424 152 C 456 148, 472 146, 488 152" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-amber)" opacity="0.9"/>
  <path d="M 624 162 C 656 158, 672 154, 688 148" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-slate)" opacity="0.8"/>
  <path d="M 108 288 C 108 250, 108 220, 108 196" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-slate)" opacity="0.8"/>
  <path d="M 176 308 C 260 310, 310 310, 360 310" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#m-violet)" opacity="0.85"/>
  <path d="M 336 180 C 350 220, 360 250, 380 268" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#m-green)" opacity="0.85"/>
  <path d="M 776 180 C 700 220, 620 255, 560 290" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#m-violet)" opacity="0.85"/>

  <text x="40" y="398" fill="#64748b" font-family="Arial,sans-serif" font-size="11">Grid meter alone cannot see total solar generation - only net import/export</text>
</svg>
