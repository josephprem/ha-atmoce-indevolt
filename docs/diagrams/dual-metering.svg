<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="solar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fbbf24"/>
    </marker>
    <marker id="grid" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#0f172a"/>
  <text x="40" y="42" fill="#f8fafc" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="700">Indevolt dual metering (third-party PV)</text>
  <text x="40" y="66" fill="#94a3b8" font-family="system-ui,Arial,sans-serif" font-size="13">Profile ù Data Source ù Grid + Solar</text>

  <g transform="translate(40,120)">
    <rect width="160" height="64" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="80" y="28" text-anchor="middle" fill="#fef3c7" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="600">Atmoce PV</text>
    <text x="80" y="48" text-anchor="middle" fill="#94a3b8" font-family="system-ui,Arial,sans-serif" font-size="10">MC100 ù 9 kWp</text>
  </g>

  <g transform="translate(260,100)">
    <rect width="180" height="88" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" fill="#dcfce7" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="600">PV meter</text>
    <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui,Arial,sans-serif" font-size="10">Shelly 3EM emulator</text>
    <text x="90" y="68" text-anchor="middle" fill="#64748b" font-family="system-ui,Arial,sans-serif" font-size="9">Solar data source</text>
  </g>

  <g transform="translate(500,120)">
    <rect width="140" height="64" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="70" y="36" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="600">Home load</text>
  </g>

  <g transform="translate(700,100)">
    <rect width="180" height="88" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" fill="#ede9fe" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="600">Grid meter</text>
    <text x="90" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui,Arial,sans-serif" font-size="10">Solarman SMD1 (LoRa)</text>
    <text x="90" y="68" text-anchor="middle" fill="#64748b" font-family="system-ui,Arial,sans-serif" font-size="9">Grid data source</text>
  </g>

  <g transform="translate(380,260)">
    <rect width="200" height="88" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="32" text-anchor="middle" fill="#e0f2fe" font-family="system-ui,Arial,sans-serif" font-size="13" font-weight="600">SF3000AC + SFA3600</text>
    <text x="100" y="54" text-anchor="middle" fill="#94a3b8" font-family="system-ui,Arial,sans-serif" font-size="10">charge / discharge control</text>
    <text x="100" y="72" text-anchor="middle" fill="#64748b" font-family="system-ui,Arial,sans-serif" font-size="9">zero-export ù self-consumption</text>
  </g>

  <g transform="translate(40,280)">
    <rect width="140" height="56" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="70" y="34" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,Arial,sans-serif" font-size="12" font-weight="600">Utility grid</text>
  </g>

  <line x1="200" y1="152" x2="260" y2="144" stroke="#fbbf24" stroke-width="2" marker-end="url(#solar)"/>
  <line x1="440" y1="144" x2="500" y2="152" stroke="#fbbf24" stroke-width="2" marker-end="url(#solar)"/>
  <line x1="640" y1="152" x2="700" y2="144" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="180" y1="308" x2="770" y2="188" stroke="#a78bfa" stroke-width="2" marker-end="url(#grid)"/>
  <line x1="110" y1="280" x2="110" y2="184" stroke="#94a3b8" stroke-width="2"/>
  <line x1="340" y1="188" x2="380" y2="290" stroke="#4ade80" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#solar)"/>
  <line x1="790" y1="188" x2="480" y2="290" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#grid)"/>

  <text x="40" y="378" fill="#64748b" font-family="system-ui,Arial,sans-serif" font-size="11">Without PV meter, grid meter alone cannot see total solar generation  only net import/export</text>
</svg>
