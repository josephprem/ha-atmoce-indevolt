<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="Atmoce and Indevolt HEMS system overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #f9fafb; }
      .subtitle { font: 16px Arial, sans-serif; fill: #9ca3af; }
      .label { font: 600 14px Arial, sans-serif; fill: #e5e7eb; }
      .small { font: 12px Arial, sans-serif; fill: #9ca3af; }
      .line { stroke-width: 3; fill: none; }
      .pv { stroke: #f59e0b; }
      .grid { stroke: #60a5fa; }
      .home { stroke: #22c55e; }
      .lora { stroke: #a78bfa; stroke-dasharray: 8 6; }
      .api { stroke: #38bdf8; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <text x="48" y="52" class="title">Home Energy System</text>
  <text x="48" y="78" class="subtitle">Atmoce PV · Indevolt SF3000AC · SFA3600 · Solarman SMD1 · Home Assistant</text>

  <!-- Solar -->
  <g transform="translate(70,130)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="150" rx="16" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
    <g transform="translate(24,24)">
      <rect x="0" y="0" width="152" height="72" rx="8" fill="#0b1220" stroke="#fbbf24" stroke-width="2"/>
      <g stroke="#f59e0b" stroke-width="1.5" opacity="0.9">
        <line x1="38" y1="0" x2="38" y2="72"/><line x1="76" y1="0" x2="76" y2="72"/><line x1="114" y1="0" x2="114" y2="72"/>
        <line x1="0" y1="24" x2="152" y2="24"/><line x1="0" y1="48" x2="152" y2="48"/>
      </g>
      <circle cx="132" cy="12" r="10" fill="#f59e0b"/>
      <path d="M132 4 L136 14 L128 14 Z" fill="#fffde7"/>
    </g>
    <text x="100" y="118" text-anchor="middle" class="label">Atmoce PV</text>
    <text x="100" y="136" text-anchor="middle" class="small">18 microinverters</text>
  </g>

  <!-- Gateway -->
  <g transform="translate(320,150)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="110" rx="14" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
    <rect x="24" y="24" width="112" height="44" rx="8" fill="#0b1220" stroke="#64748b"/>
    <circle cx="40" cy="46" r="5" fill="#22c55e"/>
    <circle cx="56" cy="46" r="5" fill="#22c55e"/>
    <rect x="72" y="38" width="52" height="16" rx="4" fill="#334155"/>
    <path d="M120 18 L128 10 L136 18" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="88" text-anchor="middle" class="label">MG100 Gateway</text>
    <text x="80" y="104" text-anchor="middle" class="small">Modbus 192.168.1.8</text>
  </g>

  <!-- Home -->
  <g transform="translate(560,120)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="160" rx="16" fill="#1f2937" stroke="#22c55e" stroke-width="2"/>
    <path d="M90 28 L40 68 H68 V118 H112 V68 H140 Z" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <rect x="78" y="88" width="24" height="30" rx="2" fill="#052e16"/>
    <text x="90" y="142" text-anchor="middle" class="label">Home Load</text>
  </g>

  <!-- SF3000 -->
  <g transform="translate(780,130)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="180" rx="16" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
    <rect x="48" y="24" width="74" height="110" rx="10" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <rect x="58" y="40" width="54" height="18" rx="4" fill="#1e3a8a"/>
    <rect x="58" y="68" width="54" height="18" rx="4" fill="#1e3a8a"/>
    <rect x="58" y="96" width="54" height="18" rx="4" fill="#1e3a8a"/>
    <circle cx="85" cy="132" r="8" fill="#22c55e"/>
    <text x="85" y="162" text-anchor="middle" class="label">SF3000AC</text>
    <text x="85" y="178" text-anchor="middle" class="small">Indevolt inverter</text>
  </g>

  <!-- SFA3600 -->
  <g transform="translate(980,145)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="150" rx="16" fill="#1f2937" stroke="#10b981" stroke-width="2"/>
    <rect x="34" y="28" width="82" height="88" rx="12" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
    <rect x="48" y="44" width="54" height="12" rx="3" fill="#10b981" opacity="0.5"/>
    <rect x="48" y="64" width="54" height="12" rx="3" fill="#10b981" opacity="0.7"/>
    <rect x="48" y="84" width="54" height="12" rx="3" fill="#10b981"/>
    <text x="75" y="132" text-anchor="middle" class="label">SFA3600</text>
    <text x="75" y="148" text-anchor="middle" class="small">Battery pack</text>
  </g>

  <!-- SMD1 meter -->
  <g transform="translate(560,320)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="120" rx="16" fill="#1f2937" stroke="#a78bfa" stroke-width="2"/>
    <rect x="20" y="48" width="140" height="10" rx="5" fill="#475569"/>
    <rect x="72" y="34" width="36" height="38" rx="6" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <path d="M90 42 v12 M84 48 h12" stroke="#c4b5fd" stroke-width="2"/>
    <text x="90" y="92" text-anchor="middle" class="label">Solarman SMD1</text>
    <text x="90" y="108" text-anchor="middle" class="small">LoRa clamp meter</text>
  </g>

  <!-- Grid -->
  <g transform="translate(320,320)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="120" rx="16" fill="#1f2937" stroke="#60a5fa" stroke-width="2"/>
    <path d="M80 28 L50 58 H62 V92 H98 V58 H110 Z" fill="none" stroke="#60a5fa" stroke-width="3"/>
    <path d="M48 92 H112" stroke="#60a5fa" stroke-width="3"/>
    <text x="80" y="112" text-anchor="middle" class="label">Utility Grid</text>
  </g>

  <!-- Home Assistant -->
  <g transform="translate(780,360)" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="130" rx="18" fill="#1f2937" stroke="#f472b6" stroke-width="2"/>
    <circle cx="58" cy="58" r="28" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <path d="M58 40 c8 0 14 6 14 14 c0 10-14 22-14 22 s-14-12-14-22 c0-8 6-14 14-14z" fill="#fbcfe8"/>
    <text x="210" y="48" text-anchor="middle" class="label">Home Assistant</text>
    <text x="210" y="72" text-anchor="middle" class="small">ha_atmoce_indevolt + Atmozen dashboard</text>
    <text x="210" y="94" text-anchor="middle" class="small">Modbus · OpenData · HEMS automations</text>
  </g>

  <!-- Flow lines -->
  <path d="M270 205 H320" class="line pv"/>
  <path d="M480 205 H560" class="line pv"/>
  <path d="M400 260 V320" class="line grid"/>
  <path d="M650 205 H780" class="line home"/>
  <path d="M950 205 H1040 V220 H955" class="line home"/>
  <path d="M650 320 V280 H855" class="line lora"/>
  <path d="M855 310 H855 V250" class="line lora"/>
  <path d="M495 380 H495 V280" class="line home"/>
  <path d="M500 205 V250" class="line home"/>
  <path d="M400 205 H320" class="line grid"/>
  <path d="M955 250 H955 V310" class="line home"/>
  <path d="M495 450 H780" class="line api"/>
  <path d="M400 205 H270" class="line api"/>
  <path d="M270 280 H270 V450 H780" class="line api"/>

  <g transform="translate(48,600)">
    <rect x="0" y="0" width="18" height="4" fill="#f59e0b" rx="2"/><text x="28" y="6" class="small">Solar / PV</text>
    <rect x="140" y="0" width="18" height="4" fill="#60a5fa" rx="2"/><text x="168" y="6" class="small">Grid</text>
    <rect x="240" y="0" width="18" height="4" fill="#22c55e" rx="2"/><text x="268" y="6" class="small">Home load</text>
    <rect x="360" y="0" width="18" height="4" fill="#a78bfa" rx="2"/><text x="388" y="6" class="small">LoRa (SMD1)</text>
    <rect x="500" y="0" width="18" height="4" fill="#38bdf8" rx="2"/><text x="528" y="6" class="small">LAN API</text>
  </g>
</svg>
