<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <marker id="pwr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="16" fill="#0f172a"/>
  <text x="40" y="44" fill="#f9fafb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Site energy and meters</text>
  <text x="40" y="68" fill="#9ca3af" font-family="Arial,sans-serif" font-size="13">Solid lines = power flow | Dashed boxes = what each meter measures</text>

  <g transform="translate(80,120)">
    <rect width="140" height="100" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
    <rect x="20" y="18" width="100" height="44" rx="6" fill="#0b1220" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="40" y1="18" x2="40" y2="62" stroke="#f59e0b" stroke-width="1"/>
    <line x1="70" y1="18" x2="70" y2="62" stroke="#f59e0b" stroke-width="1"/>
    <line x1="100" y1="18" x2="100" y2="62" stroke="#f59e0b" stroke-width="1"/>
    <text x="70" y="82" text-anchor="middle" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="13" font-weight="600">Solar</text>
    <text x="70" y="98" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">18 panels / 9 MI</text>
  </g>

  <g transform="translate(400,100)">
