    <text x="75" y="26" text-anchor="middle" fill="#fbbf24" font-family="Arial,sans-serif" font-size="11" font-weight="600">MC100 meter</text>
    <text x="75" y="44" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">PV power</text>
    <text x="75" y="58" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">Grid import / export</text>
  </g>

