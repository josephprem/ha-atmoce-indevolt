    <text x="75" y="24" text-anchor="middle" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="11" font-weight="600">SMD1 meter</text>
    <text x="75" y="42" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">Home load (clamp)</text>
  </g>

  <g transform="translate(430,400)">
