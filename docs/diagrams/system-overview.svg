    <text x="70" y="98" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">SF3000 + SFA3600</text>
  </g>

  <line x1="220" y1="170" x2="400" y2="150" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#pwr)"/>
  <line x1="540" y1="150" x2="720" y2="170" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#pwr)"/>
  <line x1="470" y1="200" x2="470" y2="280" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#pwr)"/>

  <g transform="translate(248,228)">
