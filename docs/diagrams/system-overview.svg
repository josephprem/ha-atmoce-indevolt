<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="m-amber" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m-slate" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#4ade80" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m-violet" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1100" height="540" rx="16" fill="#0b1220"/>
  <text x="48" y="46" fill="#f8fafc" font-family="Arial,sans-serif" font-size="24" font-weight="700">Home energy system overview</text>
  <text x="48" y="72" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Atmoce PV + Indevolt storage + dual metering</text>

  <!-- PV -->
  <g filter="url(#shadow)" transform="translate(48,118)">
    <rect width="176" height="88" rx="14" fill="url(#card)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="88" y="34" text-anchor="middle" fill="#fef3c7" font-family="Arial,sans-serif" font-size="13" font-weight="600">18x 500 W panels</text>
    <text x="88" y="54" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">9x 1000 W microinverters</text>
    <text x="88" y="72" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">9 kWp</text>
  </g>

  <!-- MC100 -->
  <g filter="url(#shadow)" transform="translate(276,118)">
    <rect width="196" height="88" rx="14" fill="url(#card)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="98" y="34" text-anchor="middle" fill="#fef3c7" font-family="Arial,sans-serif" font-size="13" font-weight="600">Atmoce MC100</text>
    <text x="98" y="54" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Modbus TCP :502</text>
    <text x="98" y="72" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">LAN reservation</text>
  </g>

  <!-- SF3000 -->
  <g filter="url(#shadow)" transform="translate(524,118)">
    <rect width="196" height="88" rx="14" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="98" y="34" text-anchor="middle" fill="#e0f2fe" font-family="Arial,sans-serif" font-size="13" font-weight="600">Indevolt SF3000AC</text>
    <text x="98" y="54" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">OpenData :8080</text>
    <text x="98" y="72" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">+ SFA3600 pack</text>
  </g>

  <!-- Grid -->
  <g filter="url(#shadow)" transform="translate(524,36)">
    <rect width="132" height="52" rx="12" fill="url(#card)" stroke="#64748b" stroke-width="1.5"/>
    <text x="66" y="32" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="12" font-weight="600">Utility grid</text>
  </g>

  <!-- Home load -->
  <g filter="url(#shadow)" transform="translate(524,248)">
    <rect width="132" height="52" rx="12" fill="url(#card)" stroke="#64748b" stroke-width="1.5"/>
    <text x="66" y="32" text-anchor="middle" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="12" font-weight="600">Home load</text>
  </g>

  <!-- Shelly -->
  <g filter="url(#shadow)" transform="translate(772,118)">
    <rect width="188" height="88" rx="14" fill="url(#card)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="94" y="34" text-anchor="middle" fill="#dcfce7" font-family="Arial,sans-serif" font-size="13" font-weight="600">Shelly 3EM emulator</text>
    <text x="94" y="54" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">PV meter - HTTP :80</text>
    <text x="94" y="72" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Solar data source</text>
  </g>

  <!-- SMD1 -->
  <g filter="url(#shadow)" transform="translate(772,248)">
    <rect width="188" height="68" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="94" y="30" text-anchor="middle" fill="#ede9fe" font-family="Arial,sans-serif" font-size="12" font-weight="600">Solarman SMD1</text>
    <text x="94" y="50" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="10">Grid meter - LoRa</text>
  </g>

  <!-- HA -->
  <g filter="url(#shadow)" transform="translate(276,292)">
    <rect width="196" height="96" rx="14" fill="url(#card)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="98" y="36" text-anchor="middle" fill="#dcfce7" font-family="Arial,sans-serif" font-size="13" font-weight="600">Home Assistant</text>
    <text x="98" y="58" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">VM on Freebox Ultra</text>
    <text x="98" y="78" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="10">Energy + automations</text>
  </g>

  <!-- AC power (smooth curves) -->
  <path d="M 224 162 C 248 162, 260 162, 276 162" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-amber)" opacity="0.9"/>
  <path d="M 472 162 C 498 168, 510 172, 524 162" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-amber)" opacity="0.9"/>
  <path d="M 590 88 C 590 72, 590 64, 590 52" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-slate)" opacity="0.75"/>
  <path d="M 590 206 C 590 224, 590 236, 590 248" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-slate)" opacity="0.75"/>

  <!-- Data (dashed curves) -->
  <path d="M 374 206 C 374 248, 374 268, 374 292" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#m-blue)" opacity="0.85"/>
  <path d="M 622 206 C 560 260, 520 300, 472 340" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#m-blue)" opacity="0.85"/>
  <path d="M 720 162 C 748 150, 760 145, 772 155" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#m-green)" opacity="0.85"/>
  <path d="M 720 200 C 748 230, 762 255, 772 275" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#m-violet)" opacity="0.85"/>

  <!-- Legend -->
  <g transform="translate(48,430)">
    <rect width="1004" height="76" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
    <line x1="32" y1="38" x2="72" y2="38" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <text x="84" y="42" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="12">AC power</text>
    <line x1="200" y1="38" x2="240" y2="38" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
    <text x="252" y="42" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="12">Data / control</text>
    <text x="32" y="64" fill="#64748b" font-family="Arial,sans-serif" font-size="11">Indevolt app: Grid = SMD1 | Solar = Shelly emulator</text>
  </g>
</svg>
