    <text x="70" y="92" text-anchor="middle" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="13" font-weight="600">Home</text>
  </g>

  <g transform="translate(720,120)">
    <rect width="140" height="100" rx="12" fill="#1f2937" stroke="#60a5fa" stroke-width="2"/>
    <path d="M70 18 L42 46 H56 V74 H84 V46 H98 Z" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="70" y="82" text-anchor="middle" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="13" font-weight="600">Grid</text>
  </g>

  <g transform="translate(400,280)">
    <rect width="140" height="100" rx="12" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
