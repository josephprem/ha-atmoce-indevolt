    <text x="75" y="24" text-anchor="middle" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="11" font-weight="600">SF3000 meter</text>
    <text x="75" y="42" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">Battery SOC / power</text>
  </g>

  <line x1="323" y1="228" x2="280" y2="200" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="505" y1="208" x2="470" y2="200" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="505" y1="400" x2="470" y2="380" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="40" y="490" fill="#9ca3af" font-family="Arial,sans-serif" font-size="11">MC100 = Atmoce combiner | SMD1 pairs to SF3000 via LoRa</text>
</svg>
