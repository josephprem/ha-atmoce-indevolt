    <text x="20" y="36" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="14" font-weight="600">Phase 3 - SMD1 meter</text>
    <text x="20" y="62" fill="#9ca3af" font-family="Arial,sans-serif" font-size="11">Solarman LoRa clamp meter</text>
    <text x="20" y="82" fill="#9ca3af" font-family="Arial,sans-serif" font-size="11">Pair to SF3000 in app</text>
    <text x="20" y="110" fill="#9ca3af" font-family="Arial,sans-serif" font-size="11">Home load: measured</text>
