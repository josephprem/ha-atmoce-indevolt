    <text x="20" y="62" fill="#9ca3af" font-family="Arial,sans-serif" font-size="11">Atmoce 18 panels + MG100</text>
    <text x="20" y="82" fill="#9ca3af" font-family="Arial,sans-serif" font-size="11">IP 192.168.1.8 Modbus</text>
    <text x="20" y="110" fill="#9ca3af" font-family="Arial,sans-serif" font-size="11">Home load: estimated</text>
    <text x="20" y="130" fill="#9ca3af" font-family="Arial,sans-serif" font-size="11">From PV + grid CT</text>
  </g>
  <g transform="translate(360,80)">
    <rect width="280" height="240" rx="16" fill="#1f2937" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="20" y="36" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="14" font-weight="600">Phase 2 - Battery</text>
    <text x="20" y="62" fill="#9ca3af" font-family="Arial,sans-serif" font-size="11">SF3000AC + SFA3600</text>
    <text x="20" y="82" fill="#9ca3af" font-family="Arial,sans-serif" font-size="11">Indevolt OpenData in HA</text>
