<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1000" height="360" rx="18" fill="#0f172a"/>
  <text x="36" y="40" fill="#f9fafb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Rollout phases</text>

  <g transform="translate(36,80)">
    <rect width="280" height="240" rx="16" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
