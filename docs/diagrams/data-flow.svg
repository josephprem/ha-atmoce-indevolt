<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="m-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#4ade80" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="460" rx="16" fill="#0b1220"/>
  <text x="40" y="44" fill="#f9fafb" font-family="Arial,sans-serif" font-size="22" font-weight="700">Data paths to Home Assistant</text>
  <text x="40" y="68" fill="#9ca3af" font-family="Arial,sans-serif" font-size="13">Official and community integrations</text>

  <g filter="url(#shadow)" transform="translate(40,108)">
    <rect width="200" height="76" rx="14" fill="url(#card)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="100" y="30" text-anchor="middle" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="12" font-weight="600">Atmoce MC100</text>
    <text x="100" y="50" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">Modbus TCP :502</text>
    <text x="100" y="66" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">PV, grid, energy</text>
  </g>

  <g filter="url(#shadow)" transform="translate(40,208)">
    <rect width="200" height="76" rx="14" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="100" y="30" text-anchor="middle" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="12" font-weight="600">Indevolt SF3000AC</text>
    <text x="100" y="50" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">HTTP OpenData :8080</text>
    <text x="100" y="66" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">SOC, meter_power</text>
  </g>

  <g filter="url(#shadow)" transform="translate(40,308)">
    <rect width="200" height="76" rx="14" fill="url(#card)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="100" y="30" text-anchor="middle" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="12" font-weight="600">Shelly emulator</text>
    <text x="100" y="50" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">reads HA sensors</text>
    <text x="100" y="66" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">to Indevolt app</text>
  </g>

  <g filter="url(#shadow)" transform="translate(360,168)">
    <rect width="260" height="156" rx="16" fill="url(#card)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="130" y="38" text-anchor="middle" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="14" font-weight="600">Home Assistant</text>
    <text x="130" y="60" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">VM on Freebox Ultra</text>
    <text x="130" y="86" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">Indevolt + Atmoce integrations</text>
    <text x="130" y="106" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">Shelly emulator add-on</text>
    <text x="130" y="126" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="9">Energy dashboard</text>
  </g>

  <g filter="url(#shadow)" transform="translate(720,118)">
    <rect width="240" height="64" rx="14" fill="url(#card)" stroke="#22c55e" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="12" font-weight="600">Energy dashboard</text>
    <text x="120" y="48" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">PV, grid, battery</text>
  </g>

  <g filter="url(#shadow)" transform="translate(720,218)">
    <rect width="240" height="64" rx="14" fill="url(#card)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="12" font-weight="600">Indevolt app</text>
    <text x="120" y="48" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">Grid + Solar data sources</text>
  </g>

  <g filter="url(#shadow)" transform="translate(720,318)">
    <rect width="240" height="64" rx="14" fill="url(#card)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="28" text-anchor="middle" fill="#f3f4f6" font-family="Arial,sans-serif" font-size="12" font-weight="600">Atmozen app</text>
    <text x="120" y="48" text-anchor="middle" fill="#9ca3af" font-family="Arial,sans-serif" font-size="10">Atmoce installer view</text>
  </g>

  <path d="M 240 146 C 300 170, 330 185, 360 200" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-blue)" opacity="0.9"/>
  <path d="M 240 246 C 300 250, 330 248, 360 246" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-blue)" opacity="0.9"/>
  <path d="M 240 346 C 290 320, 320 290, 360 280" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#m-green)" opacity="0.85"/>
  <path d="M 620 220 C 670 190, 700 165, 720 150" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m-blue)" opacity="0.9"/>
  <path d="M 500 260 C 600 255, 660 252, 720 250" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#m-green)" opacity="0.85"/>

  <text x="40" y="430" fill="#64748b" font-family="Arial,sans-serif" font-size="11">Shelly emulator bridges Atmoce PV to Indevolt without direct Modbus</text>
</svg>
