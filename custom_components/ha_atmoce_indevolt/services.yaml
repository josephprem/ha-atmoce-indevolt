charge_battery:
  name: Charge battery
  description: Start Indevolt real-time charging until the target SOC is reached.
  fields:
    power:
      name: Power
      description: Charging power in watts.
      required: true
      example: 1000
      selector:
        number:
          min: 50
          max: 3000
          step: 50
          unit_of_measurement: W
    target_soc:
      name: Target SOC
      description: Target state of charge in percent.
      required: true
      example: 90
      selector:
        number:
          min: 5
          max: 100
          step: 1
          unit_of_measurement: "%"

discharge_battery:
  name: Discharge battery
  description: Start Indevolt real-time discharging until the target SOC is reached.
  fields:
    power:
      name: Power
      description: Discharging power in watts.
      required: true
      example: 1000
      selector:
        number:
          min: 50
          max: 3000
          step: 50
          unit_of_measurement: W
    target_soc:
      name: Target SOC
      description: Target state of charge in percent.
      required: true
      example: 20
      selector:
        number:
          min: 5
          max: 100
          step: 1
          unit_of_measurement: "%"

install_dashboard:
  name: Install Atmozen dashboard
  description: Create or refresh the Atmozen Lovelace dashboard and sidebar entry.
